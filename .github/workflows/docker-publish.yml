name: Build & Push Oxide Server Docker Image

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'server/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oxide-server

# Р‘РµР· С†С–С”С— РіСЂСѓРїРё РїР°СЂР°Р»РµР»СЊРЅС– РїСѓС€С– РІ dev/main Р·Р°РїСѓСЃРєР°Р»Рё Р± РѕРґРЅРѕС‡Р°СЃРЅС– Р·Р±С–СЂРєРё Р·
# РѕРґРЅР°РєРѕРІРёРј С‚РµРіРѕРј latest вЂ” РїРµСЂРµРєСЂРёРІР°СЋС‡РёР№ С‚РµРі С– РІРёС‚СЂР°С‡РµРЅРёР№ cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Lowercase image name
        id: image_name
        run: |
          echo "LOWERCASE_IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.LOWERCASE_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
