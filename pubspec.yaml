name: oxide_film
description: "Cross-platform media parser for movies, series, cartoons & anime"
publish_to: 'none'
version: 2026.2.20+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  flutter_vector_icons: ^2.0.0

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^17.1.0

  # Network
  dio: ^5.8.0
  dio_smart_retry: ^7.0.1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  connectivity_plus: ^7.0.0

  # HTML Parsing & Scraping
  # Using beautiful_soup_dart for Python-like DOM parsing API
  beautiful_soup_dart: ^0.3.0

  # Video Player (cross-platform)
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5
  # Platform-specific libs
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_linux: ^1.1.3

  # Local Database
  drift: ^2.31.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # DI
  get_it: ^9.2.0
  injectable: ^2.5.0

  # Utils
  collection: ^1.18.0
  json_annotation: ^4.10.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  file_picker: ^10.3.10

  # Desktop window management (custom titlebar)
  window_manager: ^0.5.1

  # WebView for Cloudflare bypass (headless cookie extraction)
  flutter_inappwebview: ^6.1.5

  # TMDB API
  tmdb_api: ^2.1.7
  wakelock_plus: ^1.4.0
  
  # Fuzzy string matching for smart search
  fuzzywuzzy: ^1.2.0
  
  # PocketBase backend (self-hosted)
  pocketbase: ^0.19.0
  shared_preferences: ^2.3.4

  peerdart: ^0.5.6
  
  # YouTube embed player (ToS-compliant, no stream extraction)
  youtube_player_iframe: ^5.1.2
  
  # YouTube stream extraction for desktop platforms
  youtube_explode_dart: ^3.0.5
  semaphore: ^1.0.0
  skeletonizer: ^2.1.2
  image_picker: ^1.2.1
  package_info_plus: 9.0.0
  open_filex: ^4.7.0
  permission_handler: 11.3.1
  crypto: 3.0.7

  http: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.1

msix_config:
  display_name: Oxide Film
  publisher_display_name: Oxide
  identity_name: com.oxide.film
  publisher: CN=Oxide
  logo_path: logoapp.png
  languages: en-US, uk-UA
  install_certificate: true
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/version.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

dependency_overrides:
  flutter_webrtc: 0.12.12+hotfix.1
