version: '3.8'

services:
  # Redis needs vm.overcommit_memory=1 or a background save can fail under low
  # memory, which with the noeviction policy below means failed writes rather
  # than a silent restart. sysctls is namespaced by Docker, so this does not
  # touch the host.
  redis-sysctl:
    image: busybox:1.36
    command: ["sysctl", "-w", "vm.overcommit_memory=1"]
    restart: "no"
    network_mode: "none"

  app:
    image: ghcr.io/edhases/oxide-server:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8089:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      # ${VAR:?message} makes Compose refuse to start when a variable is unset,
      # instead of silently substituting a literal. Messages are quoted and
      # colon-free because they sit inside an unquoted YAML scalar.
      - "DB_USER=${POSTGRES_USER:?POSTGRES_USER is required}"
      - "DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, generate with openssl rand -base64 32}"
      - DB_NAME=${POSTGRES_DB:-oxide_film}
      - REDIS_ADDR=redis:6379
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required, generate with openssl rand -hex 32}"
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required, generate with openssl rand -base64 48}"
      - RESEND_API=${RESEND_API:-}
      - SMTP_FROM=${SMTP_FROM:-Oxide Film <noreply@oxideteam.pp.ua>}
      - APP_URL=${APP_URL:-https://film.oxideteam.pp.ua}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://film.oxideteam.pp.ua/api/v1/auth/google/callback}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-oxidefilmbot}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-https://film.oxideteam.pp.ua/api/v1/auth/discord/callback}
      - DISABLED_PROVIDERS=${DISABLED_PROVIDERS:-}
    depends_on:
      redis-sysctl:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      "POSTGRES_USER": "${POSTGRES_USER:?POSTGRES_USER is required}"
      "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, generate with openssl rand -base64 32}"
      "POSTGRES_DB": "${POSTGRES_DB:-oxide_film}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:-oxide_film}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions are 30-day refresh tokens, so an LRU policy that can evict them
    # silently signs users out at their next refresh. noeviction is the correct
    # trade; ephemeral watch-party state would belong in a second instance.
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required, generate with openssl rand -hex 32}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

volumes:
  pgdata:
