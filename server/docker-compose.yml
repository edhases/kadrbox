version: '3.8'

services:
  app:
    image: ghcr.io/edhases/oxide-server:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8089:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER is required - set it in the Portainer stack env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in the Portainer stack env (generate: openssl rand -base64 32)}
      - DB_NAME=${POSTGRES_DB:-oxide_film}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required - set it in the Portainer stack env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - set it in the Portainer stack env (generate: openssl rand -base64 48)}
      - RESEND_API=${RESEND_API:-}
      - SMTP_FROM=${SMTP_FROM:-Oxide Film <noreply@oxideteam.pp.ua>}
      - APP_URL=${APP_URL:-https://film.oxideteam.pp.ua}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://film.oxideteam.pp.ua/api/v1/auth/google/callback}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-oxidefilmbot}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-https://film.oxideteam.pp.ua/api/v1/auth/discord/callback}
      - DISABLED_PROVIDERS=${DISABLED_PROVIDERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required - set it in the Portainer stack env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in the Portainer stack env (generate: openssl rand -base64 32)}
      POSTGRES_DB: ${POSTGRES_DB:-oxide_film}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:-oxide_film}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required - set it in the Portainer stack env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

volumes:
  pgdata:
